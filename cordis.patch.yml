# dsh-model-proxy bundle patch: inserts the routing row.
#
# The values below are a starting point, not a recommendation: point `proxy` at
# your own endpoint and set `origins`/`models` to whatever you need routed. A
# configuration with no matching request is inert, and `fallbackToDirect` keeps
# a stopped proxy from failing calls that would otherwise go direct.
#
# `models` is matched against the model a request names, read from its URL path
# (`/v1beta/models/<model>:generateContent`, the native Google shape) and then
# from its body's `model` field (`/chat/completions`, the OpenAI-compatible
# shape); every other request in the process keeps the route it already had.
- insert:
    - id: model-proxy
      name: 'dsh-model-proxy'
      config:
        enabled: true
        proxy: http://127.0.0.1:7890
        origins:
          - opencode.ai
          - generativelanguage.googleapis.com
        models:
          - grok-*
          - gpt-*-luna
          - gemini-*
        fallbackToDirect: true
        probeTimeoutMs: 300
        probeCacheMs: 2000
        peekBytes: 16384
